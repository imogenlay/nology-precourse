<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex Wrap</title>
    <link rel="stylesheet" href="./style.css" />
    <script>
      let cardNumber = 4;
      function addNewBox() {
        const newCard = document.createElement("div");
        newCard.classList.add("card");
        newCard.innerHTML = "New Card " + cardNumber;
        document.getElementById("mainContainer").append(newCard);
        cardNumber++;
      }
    </script>
  </head>
  <body>
    <header>
      <nav><a href="../index.html">Return to Main Page</a></nav>
    </header>
    <main>
      <div class="button-container">
        <button onclick="addNewBox()">Add new card</button>
      </div>
      <div id="mainContainer" class="flex-container">
        <div id="blue" class="card">Card 1</div>
        <div id="orange" class="card">Card 2</div>
        <div id="pink" class="card">Card 3</div>
      </div>
    </main>
  </body>
</html>
