<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Submission Page</title>
  </head>
  <body>
    <header>
      <nav><a href="../index.html">Return to Main Page</a></nav>
      <h1>Form Submission Page</h1>
    </header>

    <main>
      <form action="./result.html">
        <div>
          <label>Full Name</label><br />
          <input
            name="full-name"
            type="text"
            placeholder="Full Name"
            minlength="2"
            maxlength="70"
            required
          />
        </div>
        <div>
          <label>Age</label><br />
          <input name="age" type="number" placeholder="Age" required />
        </div>
        <div>
          <label>State</label><br />
          <select name="state" required>
            <option disabled selected>Please choose an option</option>
            <option>ACT</option>
            <option>New South Wales</option>
            <option>Northern Territory</option>
            <option>Queensland</option>
            <option>South Australia</option>
            <option>Tasmania</option>
            <option>Victoria</option>
            <option>Western Australia</option>
          </select>
        </div>

        <div>
          <label>Email Address</label><br />
          <input
            type="email"
            placeholder="Email"
            minlength="2"
            maxlength="30"
            name="email"
            required
          />
        </div>

        <div>
          <label>Phone Number</label><br />
          <input
            type="tel"
            placeholder="Phone Number"
            minlength="2"
            maxlength="20"
            name="phone-number"
          />
        </div>

        <br />
        <div>
          <label>Message</label> <br />
          <textarea name="message">Please type your message here!</textarea>
        </div>

        <br />
        <br />
        <input type="submit" value="Click to Submit" />
      </form>
    </main>
  </body>
</html>
