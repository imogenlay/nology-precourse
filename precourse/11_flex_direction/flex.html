<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex Direction</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <nav><a href="../index.html">Return to Main Page</a></nav>
    </header>
    <p>
      My understanding of this challenge was to have the cards ordered
      sequentially in the HTML file but to have the order changed by CSS only.
    </p>
    <p>
      So, in the HTML file they go 1, 2, 3, 4, 5, 6, 7, 8, but are reversed
      here:
    </p>
    <main>
      <div class="container-vertical">
        <div class="card blue">Card 1</div>
        <div class="card khaki">Card 2</div>
        <div class="card orange">Card 3</div>
        <div class="card green">Card 4</div>
      </div>
      <div class="container-horizontal">
        <div class="card salmon">Card 5</div>
        <div class="card aqua">Card 6</div>
        <div class="card light-yellow">Card 7</div>
        <div class="card pink">Card 8</div>
      </div>
    </main>
  </body>
</html>
