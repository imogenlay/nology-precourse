<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mixin Design</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <nav><a href="../index.html">Return to Main Page</a></nav>
      <h1>>>>>>>>>>>> SASS Mixins</h1>
    </header>
    <main>
      <section class="title">
        <h2>ToDo Tasks</h2>
      </section>
      <section>
        <article class="card red">
          <h3>OVERDUE</h3>

          <div class="card-item">
            <img src="./exclamation.svg" />
            <div>
              <h4>JavaScript challenges</h4>
              <p>31st Oct 2024</p>
            </div>
          </div>

          <div class="card-item">
            <img src="./exclamation.svg" />
            <div>
              <h4>Get groceries</h4>
              <p>27th Oct 2024</p>
            </div>
          </div>
        </article>

        <article class="card blue">
          <h3>PENDING</h3>

          <div class="card-item">
            <img src="./empty.svg" />
            <div>
              <h4>Portfolio project</h4>
              <p>1st Nov 2024</p>
            </div>
          </div>
        </article>

        <div class="card green">
          <h3>COMPLETED</h3>

          <div class="card-item">
            <img src="./check.svg" />
            <div>
              <h4>Laundry</h4>
              <p>1st Oct 2024</p>
            </div>
          </div>

          <div class="card-item">
            <img src="./check.svg" />
            <div>
              <h4>Run 5km</h4>
              <p>12th Oct 2024</p>
            </div>
          </div>

          <div class="card-item">
            <img src="./check.svg" />
            <div>
              <h4>Visit grandma</h4>
              <p>15th Oct 2024</p>
            </div>
          </div>
        </div>
      </section>
    </main>
