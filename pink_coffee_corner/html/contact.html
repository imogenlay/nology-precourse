<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pink Coffee Corner</title>
    <link rel="stylesheet" href="./../style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- prettier-ignore -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Rammetto+One&display=swap" rel="stylesheet">
  </head>
  <body>
    <header>
      <a href="./../../index.html"
        ><img src="./../images/mug_hot_pink.svg" class="image__flipped"
      /></a>
      <nav>
        <a href="./home.html">HOME</a>
        <a href="./about.html">ABOUT</a>
        <b>CONTACT</b>
      </nav>
    </header>
    <main>
      <section class="contact">
        <h1 class="main__heading main__heading--color-white">Contact</h1>
        <p>Please submit a question to the café owners using the form below.</p>
        <form action="./sent.html">
          <div>
            <label>Full Name</label>
            <input
              name="full-name"
              type="text"
              placeholder="Full Name"
              minlength="4"
              maxlength="50"
              required
            />
          </div>

          <div>
            <label>Email Address</label>
            <input
              type="email"
              placeholder="Email"
              minlength="4"
              maxlength="50"
              name="email"
              required
            />
          </div>

          <div>
            <label>Category</label>
            <select name="category" required>
              <option
                value=""
                class="contact__disabled-select"
                disabled
                selected
              >
                Please choose an option
              </option>
              <option value="bookings">Bookings</option>
              <option value="online-orders">Online orders</option>
              <option value="complaints">Complaints</option>
            </select>
          </div>

          <div>
            <label>Message</label>
            <!-- prettier-ignore -->
            <textarea name="message" placeholder="Enter your message here!" required></textarea>
          </div>

          <div>
            <p></p>
            <input type="submit" value="Send" />
          </div>
        </form>
      </section>
    </main>
    <footer>
      <a href="./../../index.html"
        ><img src="./../images/mug_hot.svg" class="image__flipped" />
        <p>Copyright 2024</p></a
      >
      <img src="./../images/instagram.svg" />
    </footer>
  </body>
</html>
